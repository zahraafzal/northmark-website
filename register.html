<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NORTHMARK</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: #F4F1EA; }
        .login-container { background: white; padding: 50px; max-width: 450px; width: 100%; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .login-container h1 { text-align: center; margin-bottom: 10px; font-size: 28px; }
        .login-container p { text-align: center; color: #6E6E6E; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #E0E0E0; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #C9A227; }
        .btn-full { width: 100%; padding: 15px; background: #0B0B0B; color: white; border: none; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
        .btn-full:hover { background: #2B2B2B; }
        .text-center { text-align: center; margin-top: 20px; font-size: 14px; }
        .text-center a { color: #C9A227; font-weight: 600; }
    </style>
</head>
<body>

    <div class="top-bar">FREE WORLDWIDE SHIPPING ON ORDERS OVER $150</div>

    <header>
        <div class="container">
            <div class="logo"><a href="index.html">NORTHMARK</a></div>
            <div class="header-actions">
                <a href="index.html" class="icon-btn">← BACK</a>
            </div>
        </div>
    </header>

    <section class="login-page">
        <div class="login-container">
            <h1>Create Account</h1>
            <p>Join the MONARCH community</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>FULL NAME</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="btn-full">CREATE ACCOUNT</button>
            </form>
            
            <div class="text-center">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </section>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 MONARCH. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Account created! (Demo only)');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
