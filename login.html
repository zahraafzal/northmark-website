<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NORTHMARK</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Simple Login Page Styles */
        .login-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #F4F1EA;
        }
        
        .login-container {
            background: white;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        
        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .login-container p {
            text-align: center;
            color: #6E6E6E;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E0E0E0;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #C9A227;
        }
        
        .btn-full {
            width: 100%;
            padding: 15px;
            background: #0B0B0B;
            color: white;
            border: none;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .btn-full:hover {
            background: #2B2B2B;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #6E6E6E;
            position: relative;
        }
        
        .divider:before,
        .divider:after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #E0E0E0;
        }
        
        .divider:before { left: 0; }
        .divider:after { right: 0; }
        
        .text-center {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .text-center a {
            color: #C9A227;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        FREE WORLDWIDE SHIPPING ON ORDERS OVER $150
    </div>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">NORTHMARK</a>
            </div>
            
            <div class="header-actions">
                <a href="index.html" class="icon-btn">← BACK</a>
                <a href="cart.html" class="icon-btn">🛍️</a>
            </div>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-page">
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Login to your account</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-full">LOGIN</button>
                
                <div class="text-center">
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
            
            <div class="divider">OR</div>
            
            <div class="text-center">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 MONARCH. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // Simple login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Login successful! (Demo only)');
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
