<!DOCTYPE html>
<html lang="en">
<head>

                    <button class="btn-add-cart">ADD TO BAG</button>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 MONARCH. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
